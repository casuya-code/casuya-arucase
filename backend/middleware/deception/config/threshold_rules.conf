[tarpit]
threshold_requests = 25
slow_stream_bytes = 1048576

[block]
ip_repeat_hits = 3
autoban_ttl_hours = 24

[alert]
# Leave webhook_url blank to disable alerts; set DECEPTION_WEBHOOK_URL / DECEPTION_WEBHOOK_SECRET in .env to enable.
webhook_url = 
encryption_key = CHANGE_ME

[stealth]
# Attackers fingerprint deception via X- headers and canned responses.
# Keep these OFF in production and vary responses to evade detection.
emit_layer_headers = false
vary_response = true
rotation_interval_hours = 168
